<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Даналық кафесі</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#3c332b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7eedd,#e7d3b4);min-height:100vh}.wrap{max-width:1160px;margin:auto;padding:22px}header{text-align:center;background:#fff9ed;border:2px solid #d4b67d;border-radius:20px;padding:17px;box-shadow:0 8px 25px #63503819}h1{margin:0;font-size:clamp(25px,3.5vw,43px);color:#69502d}header p{margin:8px 0 0;font-size:18px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.jararea{background:#ffffffc9;border-radius:20px;padding:14px;text-align:center;min-height:330px;border:2px solid #d8c9ac}.jararea h2{margin:0 0 8px;font-size:clamp(20px,2.4vw,29px)}.jar{position:relative;margin:10px auto 0;width:min(100%,390px);min-height:255px;border:7px solid #9cba9f;border-top:19px solid #73977a;border-radius:34px 34px 52px 52px;background:linear-gradient(120deg,#ffffffb3,#d8f0d8b3);padding:19px 12px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:8px;transition:.2s}.bad .jar{border-color:#c99c84;border-top-color:#ae715c;background:linear-gradient(120deg,#fff8f1,#f5d8c8)}.jar.over{outline:5px dashed #c89c49;outline-offset:5px;transform:scale(1.015)}.hint{color:#766e62;font-size:14px;margin:8px}.bank{margin-top:20px;background:#fffaf1;border:2px solid #ddc89d;border-radius:20px;padding:16px;text-align:center}.bank h2{margin:0 0 12px}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;min-height:66px}.tile{font:600 19px 'Segoe UI',Arial,sans-serif;cursor:grab;border:2px solid #b68b55;background:#fff;color:#4a3b2d;padding:12px 18px;border-radius:12px;box-shadow:0 3px 0 #dbc49e;touch-action:manipulation}.tile:focus-visible{outline:4px solid #416cb4}.tile.selected{background:#ffe4a6;border-color:#b77919;box-shadow:0 0 0 3px #e5b44d}.jar .tile{font-size:17px;padding:9px 12px;cursor:pointer}.tile.correct{border-color:#23834e;background:#dff4e4}.tile.wrong{border-color:#bd3e32;background:#ffe0db}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:17px 0}button.action{border:0;border-radius:13px;padding:14px 22px;font-size:18px;font-weight:700;cursor:pointer;background:#416f60;color:white}button.action.secondary{background:#846b49}button:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;font-size:22px;font-weight:700;min-height:32px}.count{font-size:15px;color:#5e574e}footer{text-align:center;color:#756b5e;font-size:14px}@media(max-width:650px){.wrap{padding:10px}.layout{gap:9px}.jararea{padding:7px;min-height:300px}.jar{min-height:250px;padding:10px 4px;border-width:4px;border-top-width:13px}.tile{font-size:16px;padding:10px}.jar .tile{font-size:14px;padding:7px 5px}}
</style></head><body><main class="wrap"><header><h1>☕ Даналық кафесі</h1><p>Қасиеттерді екі құтыға орналастыр</p><p class="hint">Сөзді құтыға сүйреп апар немесе сөзді таңдап, құтыны бас.</p></header><section class="layout"><div class="jararea good"><h2>🌿 Жақсы қасиеттер</h2><div class="jar" id="good" role="group" tabindex="0" aria-label="Жақсы қасиеттер құтысы"></div><div class="count" id="goodCount">0 / 5</div></div><div class="jararea bad"><h2>🍂 Жаман қасиеттер</h2><div class="jar" id="bad" role="group" tabindex="0" aria-label="Жаман қасиеттер құтысы"></div><div class="count" id="badCount">0 / 5</div></div></section><section class="bank" id="bankArea"><h2>Даналық мәзірі</h2><div class="tiles" id="bank"></div></section><div class="controls"><button class="action" id="check" disabled>✓ Жауаптарды тексеру</button><button class="action secondary" id="reset">↻ Қайта бастау</button></div><div class="result" id="result" aria-live="polite"></div><footer>6-сынып • «Ғылым таппай мақтанба»</footer></main><script>
const data=[['Талап','good'],['Еңбек','good'],['Терең ой','good'],['Қанағат','good'],['Рақым','good'],['Өсек','bad'],['Өтірік','bad'],['Мақтаншақ','bad'],['Еріншек','bad'],['Бекер мал шашу','bad']];data.sort(()=>Math.random()-.5);let placed={},selected=null,checked=false;const bank=document.getElementById('bank'),result=document.getElementById('result');function tile(word){const el=document.createElement('button');el.type='button';el.className='tile'+(selected===word?' selected':'');el.textContent=word;el.draggable=true;el.setAttribute('aria-pressed',selected===word);el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',word);e.dataTransfer.effectAllowed='move'});el.addEventListener('click',()=>{if(placed[word]){delete placed[word];selected=null}else selected=selected===word?null:word;checked=false;render()});if(checked&&placed[word])el.classList.add(placed[word]===data.find(x=>x[0]===word)[1]?'correct':'wrong');return el}function render(){bank.replaceChildren();for(const id of ['good','bad'])document.getElementById(id).replaceChildren();for(const [word] of data)(placed[word]?document.getElementById(placed[word]):bank).append(tile(word));for(const id of ['good','bad'])document.getElementById(id+'Count').textContent=Object.values(placed).filter(x=>x===id).length+' / 5';document.getElementById('check').disabled=Object.keys(placed).length!==10;if(!checked)result.textContent=selected?'«'+selected+'» сөзін орналастыру үшін құтыны бас.':''}function move(word,id){if(!data.some(x=>x[0]===word))return;placed[word]=id;selected=null;checked=false;render()}for(const id of ['good','bad']){const el=document.getElementById(id);el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');move(e.dataTransfer.getData('text/plain'),id)});el.addEventListener('click',e=>{if(e.target.closest('.tile'))return;if(selected)move(selected,id)});el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();move(selected,id)}})}bank.addEventListener('dragover',e=>e.preventDefault());bank.addEventListener('drop',e=>{e.preventDefault();const word=e.dataTransfer.getData('text/plain');delete placed[word];selected=null;checked=false;render()});document.getElementById('check').addEventListener('click',()=>{checked=true;const score=data.filter(([w,id])=>placed[w]===id).length;render();result.textContent=score===10?'🎉 Жарайсыңдар! Барлық 10 қасиет дұрыс орналастырылды!':'Нәтиже: '+score+' / 10. Қызыл түспен белгіленген сөздерді түзетіңдер.'});document.getElementById('reset').addEventListener('click',()=>{placed={};selected=null;checked=false;data.sort(()=>Math.random()-.5);render()});render();
</script></body></html>
